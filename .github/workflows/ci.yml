name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # opencv-python links against libGL even when only the headless parts are
      # used, and importing cv2 fails without it on a bare runner.
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The whole suite runs against the scripted scene, so CI needs neither the
      # 35 MB model file nor any footage.
      - name: Run tests
        run: python -m pytest tests -q

      - name: Rebuild the demo video and figures
        run: |
          python scripts/demo_synthetic.py --out /tmp/demo.mp4
          python scripts/make_figures.py
